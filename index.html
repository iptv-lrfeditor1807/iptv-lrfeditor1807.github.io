  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#151d33;--panel2:#202b46;--text:#f4f7ff;--muted:#a9b4ce;--accent:#58b7ff;--danger:#ff7d8d}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#080c18,#111b34);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:28px 5vw 22px;border-bottom:1px solid #293657}h1{margin:0 0 8px;font-size:clamp(1.7rem,4vw,2.8rem)}h2{margin:0 0 14px;font-size:1.15rem}.hello{color:var(--accent);font-weight:700}.notice{color:var(--muted);max-width:850px;line-height:1.5}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:20px;padding:22px 5vw}.card{background:rgba(21,29,51,.94);border:1px solid #2b3858;border-radius:14px;padding:18px;box-shadow:0 10px 28px #0004}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}input,select,button{font:inherit;border-radius:8px;border:1px solid #3a4a70;padding:10px 12px;background:#0e1528;color:var(--text)}input{flex:1;min-width:190px}button{cursor:pointer;background:var(--accent);color:#06101d;border:0;font-weight:700}button.secondary{background:var(--panel2);color:var(--text)}button:disabled{opacity:.5;cursor:not-allowed}video{width:100%;aspect-ratio:16/9;background:#05070c;border-radius:10px;display:block}.now{margin:12px 0;color:var(--muted);min-height:22px}.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;max-height:65vh;overflow:auto}.channel{display:flex;align-items:center;gap:10px;text-align:left;background:#1c2742;color:var(--text);min-height:58px}.channel img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:6px}.channel span{display:block}.channel small{display:block;color:var(--muted);margin-top:3px}.empty{color:var(--muted);padding:14px 0}.browser-list{padding-left:20px;color:var(--muted);line-height:1.8}.browser-list a{color:var(--accent)}footer{padding:18px 5vw 30px;color:var(--muted);font-size:.9rem}a{color:var(--accent)}@media(max-width:850px){main{grid-template-columns:1fr}.channels{max-height:50vh}}
  </style>
